      # Mission-08A phase B: the transport that closes B-08A-RELAY-01. The server-side
      # fetcher only ever receives TikTok's Security Check shell (an identical ~5.6KB wall
      # for every product), so the listing is readable ONLY in a tab the operator has
      # already authenticated. Direct fetch stays the default; the relay is entered on the
      # ONE typed failure that means "we were never shown the listing". The content script
